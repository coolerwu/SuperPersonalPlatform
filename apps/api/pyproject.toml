[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-command-center-api"
version = "0.1.0"
description = "Agent Command Center v1 API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "greenlet>=3.0,<4",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "cryptography>=38,<49",
  "httpx>=0.27,<1",
  "playwright>=1.49,<2",
  "pyyaml>=6,<7",
  "segno>=1.6,<2",
  "langchain-core>=0.3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "croniter>=2,<7",
  "pillow>=10,<13",
  "claude-agent-sdk>=0.2.180,<0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["seed_skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
