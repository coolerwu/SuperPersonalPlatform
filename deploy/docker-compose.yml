services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: acc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acc}
      POSTGRES_DB: acc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acc -d acc"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:-dev-token}
      APP_DATABASE_URL: postgresql+asyncpg://acc:${POSTGRES_PASSWORD:-acc}@postgres:5432/acc
      APP_DATA_DIR: /data
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
