auth:
  token: "change-me"
server:
  host: "0.0.0.0"
  port: 8888
browser:
  proxy: ""
  timeout_ms: 60000
  allow_private_hosts: []
code_execution:
  enabled: true
  runtime: "docker_gvisor"
  languages:
    - "python"
    - "shell"
  timeout_seconds: 20
  max_stdout_chars: 20000
  max_stderr_chars: 20000
  max_file_bytes: 10485760
  max_files: 20
  docker:
    runtime: "runsc"
    image: "python:3.12-slim-bookworm"
    network: "none"
    memory: "512m"
    cpus: "1"
    pids_limit: 64
llm:
  default_model_id: "default"
  models:
    - id: "default"
      name: "默认 DeepAgent 模型"
      provider: "openai_compatible"
      base_url: "https://api.openai.com/v1"
      api_key: "change-me"
      model: "gpt-4o-mini"
      # 可选估算单价：每百万 tokens，按实际供应商填写；缺省不估价。
      # input_price_per_million: 1.0
      # output_price_per_million: 2.0
      # price_currency: USD
      temperature: 0.7
      supports_images: false
nutstore:
  enabled: false
  base_url: "https://dav.jianguoyun.com/dav/"
  username: ""
  password: ""
  root_path: "/"
context:
  webdav_sync:
    enabled: false
    root_path: "/notebook"
    interval_seconds: 600
    max_files_per_root: 500
    max_file_size_bytes: 524288
    extensions:
      - ".md"
      - ".txt"
      - ".json"
      - ".jsonl"
maintenance:
  enabled: true
  interval_seconds: 86400
  retention_days: 15
  dry_run: false
channels:
  wechat_personal:
    enabled: false
    accounts:
      - id: "main"
        name: "主账号"
        default_agent_id: "assistant"
        auto_start: false
        proxy: ""
agents:
  definitions:
    - id: "assistant"
      name: "默认助手"
      system_prompt: "你是一个运行在后端的 DeepAgent。"
      model_id: "default"
      context_ids: []
      webdav:
        enabled: false
        directories: []
      deepagent:
        max_iterations: 60
        todo_list: true
        tools:
          - search_session
          - arxiv
          - yahoo_finance_news
