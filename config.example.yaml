      temperature: 0.7
      supports_images: true
agents:
  default_agent_id: "assistant"
  definitions:
    - id: "assistant"
      name: "个人助理"
      system_prompt: "你是一个直接、可靠的个人助理。用中文简洁回答。"
      model_id: "default"
