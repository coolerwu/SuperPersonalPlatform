auth:
  token: "change-me"
proxy:
  upstream_base_url: "http://192.168.1.3:9119/"
server:
  host: "0.0.0.0"
  port: 8888
llm:
  default_model_id: "default"
  models:
    - id: "default"
      name: "默认模型"
      provider: "openai_compatible"
      base_url: "https://api.openai.com/v1"
      api_key: "change-me"
      model: "gpt-4o-mini"
      temperature: 0.7
      supports_images: true
common_skills:
  tools:
    - "list_skill"
    - "read_skill"
tools:
  profile: "default"
  allow: []
  deny: []
skills:
  definitions:
    - id: "common:self-dev"
channels:
  wechat_personal:
    enabled: true
    default_agent_id: "assistant"
    # Multi-account format (preferred):
    accounts:
      - id: "main"
        name: "主账号"
        default_agent_id: "assistant"
        auto_start: false
        # Optional explicit proxy for iLink HTTP client.
        proxy: ""
    # Legacy single-account format (used when 'accounts' is absent):
    # enabled: false
    # default_agent_id: "assistant"
    # auto_start: false
    # proxy: ""
agents:
  definitions:
    - id: "assistant"
      name: "个人助理"
      system_prompt: "你是一个直接、可靠的个人助理。用中文简洁回答。"
      model_id: "default"
      skill_ids: []
