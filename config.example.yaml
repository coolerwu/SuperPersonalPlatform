auth:
  token: "change-me"
server:
  host: "0.0.0.0"
  port: 8888
browser:
  proxy: ""
  timeout_ms: 60000
  allow_private_hosts: []
code_execution:
  enabled: true
  runtime: "docker_gvisor"
  languages:
    - "python"
    - "shell"
  timeout_seconds: 20
  max_stdout_chars: 20000
  max_stderr_chars: 20000
  max_file_bytes: 10485760
  max_files: 20
  docker:
    runtime: "runsc"
    image: "python:3.12-slim-bookworm"
    network: "none"
    memory: "512m"
    cpus: "1"
    pids_limit: 64
llm:
  default_model_id: "default"
  models:
    - id: "default"
      name: "默认 DeepAgent 模型"
      provider: "openai_compatible"
      base_url: "https://api.openai.com/v1"
      api_key: "change-me"
      model: "gpt-4o-mini"
      # 可选估算单价：每百万 tokens，按实际供应商填写；缺省不估价。
      # input_price_per_million: 1.0
      # output_price_per_million: 2.0
      # price_currency: USD
      temperature: 0.7
      supports_images: false
nutstore:
  enabled: false
  base_url: "https://dav.jianguoyun.com/dav/"
  username: ""
  password: ""
  root_path: "/"
context:
  webdav_sync:
    enabled: false
    root_path: "/"
    interval_seconds: 600
    max_files_per_root: 500
    max_file_size_bytes: 524288
    extensions:
      - ".md"
      - ".txt"
      - ".json"
      - ".jsonl"
maintenance:
  enabled: true
  interval_seconds: 86400
  retention_days: 15
  dry_run: false
market:
  enabled: false
  exchange: "binance"
  # 留空用官方只读行情域 data-api.binance.vision。境内实测：该域名可直连，
  # api.binance.com 直连超时、经代理出口还会被判 HTTP 451。
  base_url: ""
  # 留空则直连（生产机实测不需要代理）；填了则所有行情请求都走它。
  proxy: ""
  poll_seconds: 5
  history_limit: 400
  retention_days: 30
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  # 只在自选列表为空时作为一次性种子；之后以 /market 页面维护的列表为准。
  symbols:
    - symbol: "BTC/USDT"
      alias: "比特币"
  signals:
    enabled: true
    volume_spike_ratio: 1.8
    atr_high_ratio: 1.5
    atr_low_ratio: 0.75
    rsi_overbought: 70
    rsi_oversold: 30
    breakout_lookback: 20
    cooldown_seconds: 900
    notify_min_severity: "high"
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
    min_severity: "high"
  commentary:
    enabled: true
    # 慢层解读使用的 Agent；留空则不能从页面触发分析。
    agent_id: "assistant"
    interval_seconds: 3600
    timeframes:
      - "1h"
      - "4h"
      - "1d"
channels:
  wechat_personal:
    enabled: false
    accounts:
      - id: "main"
        name: "主账号"
        default_agent_id: "assistant"
        auto_start: false
        proxy: ""
agents:
  definitions:
    - id: "assistant"
      name: "默认助手"
      system_prompt: ""  # 留空使用平台默认规则
      model_id: "default"
      context_ids: []
      webdav:
        enabled: false
        directories: []
      deepagent:
        max_iterations: 60
        todo_list: true
        tools:
          - search_session
          - arxiv
          - yahoo_finance_news
