auth:
  token: "change-me"
server:
  host: "0.0.0.0"
  port: 8888
llm:
  default_model_id: "default"
  models:
    - id: "default"
      name: "默认 DeepAgent 模型"
      provider: "openai_compatible"
      base_url: "https://api.openai.com/v1"
      api_key: "change-me"
      model: "gpt-4o-mini"
      temperature: 0.7
      supports_images: false
nutstore:
  enabled: false
  base_url: "https://dav.jianguoyun.com/dav/"
  username: ""
  password: ""
  root_path: "/"
context:
  webdav_sync:
    enabled: false
    root_path: "/notebook"
    interval_seconds: 600
    max_files_per_root: 500
    max_file_size_bytes: 524288
    extensions:
      - ".md"
      - ".txt"
      - ".json"
      - ".jsonl"
  webdav_permissions:
    - path: "/"
      readable: true
      writable: false
      protected: true
    - path: "/00AgentInbox"
      readable: true
      writable: true
      protected: false
maintenance:
  enabled: true
  interval_seconds: 86400
  retention_days: 15
  dry_run: false
channels:
  wechat_personal:
    enabled: false
    accounts:
      - id: "main"
        name: "主账号"
        default_agent_id: "assistant"
        auto_start: false
        proxy: ""
agents:
  definitions:
    - id: "assistant"
      name: "默认助手"
      system_prompt: "你是一个运行在后端的 DeepAgent。"
      model_id: "default"
      context_ids: []
      deepagent:
        max_iterations: 60
        name: ""
        debug: false
        todo_list: true
        filesystem:
          enabled: false
          root: "agent"
          mode: "read_write"
        use_longterm_memory: true
        tools: []
        interrupt_on: []
        middleware: []
        subagents: []
        response_format: ""
        context_schema: ""
        checkpointer: false
        store: ""
        cache: ""
