[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-personal-platform"
version = "0.1.0"
description = "A full-stack personal platform served by FastAPI."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "qrcode>=7.4",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["."]
